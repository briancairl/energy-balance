services:
  energy-balance:
    build: .
    ports:
      - "8081:8081"
      - "8082:8082"
    # Mounts the whole project dir into the container so server.py reads/writes
    # configs/config.json, secrets/tokens.json, caches/*cache.json,
    # secrets/app_store.json, etc. straight from the host — they persist across
    # container rebuilds and stay in one place whether you're editing
    # src/js/app-source.jsx or just running the server.
    volumes:
      - .:/app
    restart: unless-stopped
